<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Tareas</title>
  <link rel="stylesheet" href="..//mi-tareas/src/index.css" />
</head>
<body>

<div class="app">
 
  <div class="panel panel-left">
    <div class="panel-header">
      <div class="header-left">
        <button class="btn-menu" aria-label="Menú">
          <svg width="22" height="16" viewBox="0 0 22 16" fill="none">
            <rect width="22" height="2.5" rx="1.25" fill="#333"/>
            <rect y="6.75" width="16" height="2.5" rx="1.25" fill="#333"/>
            <rect y="13.5" width="22" height="2.5" rx="1.25" fill="#333"/>
          </svg>
        </button>
        <span class="panel-title">MIS TAREAS</span>
      </div>
      <div class="avatar">U</div>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24"
             stroke="#999" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21"/>
        </svg>
        <input id="search" type="text" placeholder="Buscar tareas..." />
      </div>
    </div>

    <div class="task-list" id="taskList"></div>

    <div class="fab-row">
      <button class="fab" id="btnNew" title="Nueva tarea">+</button>
    </div>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="Tasks">
        <div class="nav-icon-wrap active" id="wrap-Tasks">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24"
               stroke="white" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </div>
        Tasks
      </button>
      <button class="nav-btn" data-tab="Calendar">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24"
             stroke="#AAA" stroke-width="2" id="icon-Calendar">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Calendar
      </button>
      <button class="nav-btn" data-tab="Completed">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24"
             stroke="#AAA" stroke-width="2" id="icon-Completed">
          <circle cx="12" cy="12" r="9"/>
          <path d="M8 12l3 3 5-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Completed
      </button>
    </nav>
  </div>

  
  <div class="panel panel-right">
    <div class="panel-header">
      <div class="header-left">
        <button class="btn-close" id="btnClose">✕</button>
        <span class="panel-title" id="formHeading">MIS TAREA</span>
      </div>
      <div class="avatar">U</div>
    </div>

    <div class="form-body">
      <label class="form-label">TÍTULO DE LA TAREA</label>
      <input class="form-input" id="inputTitle"
             placeholder="Escribe el nombre de la tarea..." />

      <label class="form-label">DESCRIPCIÓN</label>
      <textarea class="form-textarea" id="inputDesc" rows="4"
                placeholder="Añade detalles o notas importantes..."></textarea>

      <label class="form-label">ESTADO INICIAL</label>
      <div class="status-picker">
        <button class="status-btn active" data-status="Pendiente">Pendiente</button>
        <button class="status-btn" data-status="En progreso">En progreso</button>
        <button class="status-btn" data-status="Hecha">Hecha</button>
      </div>

      <div class="preview-card" id="previewCard">
        <div class="task-title-row">
          <span class="task-name" id="previewName"></span>
          <span class="badge" id="previewBadge"></span>
        </div>
        <p class="task-desc" id="previewDesc"></p>
      </div>
    </div>

    <div class="save-area">
      <button class="save-btn" id="btnSave">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24"
             stroke="white" stroke-width="2.5">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Guardar Tarea
      </button>
    </div>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
